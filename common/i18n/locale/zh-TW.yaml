    save_help_text: |
      使用方法:

      1. 使用此命令回覆要儲存的檔案，可選填檔名參數。
      範例:
      /save custom_file_name.mp4

      2. 設定預設儲存後，傳送 /save <頻道ID/使用者名稱> <訊息ID範圍> 來批次儲存檔案。遵從儲存規則，若未匹配到任何規則則使用預設儲存。
      範例:
      /save @acherkrau 114-514
    watch_help_text: |
      使用 /watch 命令監聽一個聊天的訊息，並自動儲存到預設儲存中，遵從儲存規則。

      命令語法:
      /watch <chat_id> [filter]

      參數:
      - <chat_id>: 聊天的 ID 或使用者名稱
      - [filter]: 可選，格式為 過濾器類型:表達式，所有支援類型的過濾器請參閱文件

      命令範例:
      /watch -1002229835658 msgre:.*plana.*

      這將監聽 ID 為 -1002229835658 的聊天，並轉存所有包含 "plana" 的媒體訊息
