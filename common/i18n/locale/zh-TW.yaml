        /fnametmpl 圖片_{{"{{.msgid}}"}}_{{"{{.msgdate}}"}}.jpg

        可用變數:
        - {{"{{.msgid}}"}}: 訊息ID
        - {{"{{.msgtags}}"}}: 訊息中的標籤，將以底線分隔輸出
