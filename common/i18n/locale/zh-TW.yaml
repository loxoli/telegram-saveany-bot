bot:
  msg:
    help_text_fmt: |
      Save Any Bot - 轉存你的 Telegram 檔案
      版本: %s , 提交: %s

      命令:
      /start - 開始使用
      /help - 顯示說明
      /silent - 開關靜默模式
      /storage - 設定預設儲存位置
      /save [自訂檔名] - 儲存檔案
      /dl <連結1> <連結2> ... - 下載指定連結的檔案
      /import <儲存名> <目錄路徑> [頻道ID] [過濾器] - 從儲存端匯入檔案到 Telegram
      /dir - 管理儲存目錄
      /rule - 管理規則
      /config - 修改設定
      /fnametmpl - 設定檔案自訂命名模板
      /parser - 管理解析器外掛
      /task - 管理任務佇列
      /watch - 監聽聊天並自動儲存 (UserBot)
      /unwatch - 取消監聽聊天 (UserBot)
      /lswatch - 列出正在監聽的聊天 (UserBot)
      /syncpeers - 同步對話列表 (UserBot)
      /update - 檢查更新並升級

      使用說明: https://sabot.unv.app/usage
    cmd:
