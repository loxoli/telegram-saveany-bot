# 建立檔案時，若需要保留中文註解，請務必確保本檔案編碼為 UTF-8 ，否則會無法讀取。
# 更詳細的設定請在 https://sabot.unv.app/deployment/configuration 查看
workers = 4    # 同時下載檔案數
retry = 3      # 下載失敗重試次數
threads = 4    # 單一任務下載使用的最大執行緒數
stream = false # 使用串流傳輸模式, 建議僅在硬碟空間十分有限時使用.

[log]
# 日誌層級, 可選: debug, info, warn, error, fatal
level = "debug"

[telegram]
# Bot Token
# 更換 Bot Token 後請刪除會話資料庫檔案 (預設路徑為 data/session.db )
token = ""
# Telegram API 設定, 若不設定也可執行, 將使用預設的 API ID 和 API HASH
# 推薦使用自己的 API ID 和 API HASH (https://my.telegram.org)
# app_id = 1025907
# app_hash = "452b0359b988148995f22ff0f4229750"
[telegram.proxy]
# 啟用代理連接 telegram
enable = false
url = "socks5://127.0.0.1:7890"

# Aria2 設定
[aria2]
# 啟用 Aria2 下載支援
enable = false
# Aria2 RPC URL
url = "http://localhost:6800/jsonrpc"
# Aria2 RPC Secret (如果設定了 rpc-secret)
secret = ""
# 轉存完成後刪除 Aria2 下載的本機檔案
remove_after_transfer = true

# yt-dlp 影片下載設定
[ytdlp]
# 預設下載的最高影片解析度 (按高度限制), 如 1080, 720, 480; 0 表示不限制 (下載最佳畫質)
# 僅在使用 /ytdlp 命令且未手動指定任何參數時生效
max_height = 1080
# 直接指定 yt-dlp format 選擇表達式, 留空則使用 max_height
# 設定後優先順序高於 max_height, 例如: "bv*[height<=720]+ba/b"
format = ""
# 下載後轉封裝的影片容器格式, 留空則不轉封裝. 預設 mp4
recode = "mp4"

# HTTP API 設定
[api]
# 啟用 HTTP API
enable = false
# 監聽位址
host = "0.0.0.0"
# 監聽連接埠
port = 8080
# 認證 Token (必要)
token = ""

# 儲存空間清單
[[storages]]
# 識別名稱, 需要唯一
name = "本機1"
# 儲存類型, 目前可用: local, alist, webdav, s3, telegram
type = "local"
# 啟用儲存空間
enable = true
# 檔案儲存根路徑
base_path = "./downloads"

[[storages]]
name = "MyWebdav"
type = "webdav"
enable = false
base_path = '/path/telegram'
url = 'https://example.com/dav'
username = 'username'
password = 'password'

# 使用者清單
[[users]]
# telegram user id
id = 114514
# 儲存空間過濾清單, 元素為儲存識別名稱.
# 將該清單留空並開啟黑名單過濾模式以允許使用所有儲存空間，此處示範為黑名單模式，使用者 114514 可使用所有儲存空間
storages = []
# 使用清單過濾黑名單模式，反之則為白名單，白名單請在清單中指定可用的儲存空間.
blacklist = true

[[users]]
id = 123456
storages = ["本機1"]
blacklist = false  # 使用白名單模式，此時，使用者 123456 僅可使用識別名稱為 '本機1' 的儲存空間
